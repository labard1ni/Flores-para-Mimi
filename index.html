<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌻</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fondo animado -->
    <div class="stars"></div>

    <!-- Pétalos -->
    <div id="petals"></div>

    <main class="container">

        <section class="card">

            <div class="date">
                21 DE SEPTIEMBRE
            </div>

            <h1>🌻 Para Yami 🌻</h1>

            <p class="subtitle">
                Hoy quiero regalarte algo más que flores...
            </p>

            <!-- Ramo de flores (imagen) -->
            <div class="bouquet">
                <img src="gira.png" alt="Ramo de girasoles" class="bouquet-img">
            </div>

            <button id="openMessage">
                💛Toca aquí, mi amor💛
            </button>

            <div id="message" class="message">

                <h2>🌻💛 Para Mimi 💛🌻</h2>

                <p id="typingText"></p>

                <!-- Foto de la pareja -->
                <div class="couple-photo">
                    <img src="nosotros.jpeg" alt="Nosotros" class="photo">
                    <p class="photo-caption">Tú y yo 💛</p>
                </div>

                <div class="heart">
                    ❤️
                </div>

            </div>

        </section>

    </main>

    <div class="bottom-text">
        Hecho con cariño para ti 💛
    </div>

    <script src="script.js"></script>

</body>
</html>
