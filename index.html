<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21 de Septiembre 🌻</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fondo animado -->
    <div class="stars"></div>

    <!-- Pétalos -->
    <div id="petals"></div>

    <main class="container">

        <section class="card">

            <div class="date">
                21 DE SEPTIEMBRE
            </div>

            <h1>🌻 Para ti 🌻</h1>

            <p class="subtitle">
                Hoy quiero regalarte algo más que flores...
            </p>

            <!-- Ramo -->
            <div class="bouquet">

                <div class="flower flower1">
                    <div class="stem"></div>
                    <div class="flower-head">
                        <span>🌻</span>
                    </div>
                </div>

                <div class="flower flower2">
                    <div class="stem"></div>
                    <div class="flower-head">
                        <span>🌻</span>
                    </div>
                </div>

                <div class="flower flower3">
                    <div class="stem"></div>
                    <div class="flower-head">
                        <span>🌻</span>
                    </div>
                </div>

                <div class="flower flower4">
                    <div class="stem"></div>
                    <div class="flower-head">
                        <span>🌻</span>
                    </div>
                </div>

                <div class="flower flower5">
                    <div class="stem"></div>
                    <div class="flower-head">
                        <span>🌻</span>
                    </div>
                </div>

            </div>

            <button id="openMessage">
                💛 Toca aquí 💛
            </button>

            <div id="message" class="message">

                <h2>🌻 Para alguien especial 🌻</h2>

                <p id="typingText"></p>

                <div class="heart">
                    ❤️
                </div>

            </div>

        </section>

    </main>

    <div class="bottom-text">
        Hecho con cariño para ti 💛
    </div>

    <script src="script.js"></script>

</body>
</html>
